<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Streaming</title>
  </head>

  <body>
    <h1>H.264 progressive video</h1>

    <video controls preload="metadata" width="800">
      <source
        src="https://storage.googleapis.com/cse4265-2026-103415657.appspot.com/demo-h264.mp4"
        type="video/mp4"
      />
      Your browser does not support HTML video.
    </video>

    <h1>H.265 video</h1>

    <video controls preload="metadata" width="800">
      <source
        src="https://storage.googleapis.com/cse4265-2026-103415657.appspot.com/demo-h265.mp4"
        type="video/mp4"
      />
      Your browser does not support HTML video.
    </video>
  </body>
</html>
